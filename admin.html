<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel del complejo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="wrap">
    <section id="login" class="card" hidden>
      <h2>Ingresar al panel</h2>
      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn block" type="submit">Entrar</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </section>

    <div id="app" hidden>
      <div class="toolbar">
        <div>
          <h1 style="margin:0;font-size:1.5rem" id="title">Panel</h1>
          <span class="muted small" id="mode"></span>
        </div>
        <button class="btn ghost sm" id="logout" type="button" hidden>Salir</button>
      </div>

      <section class="card">
        <label for="public-link">Link para tus clientes</label>
        <div class="linkbox">
          <input id="public-link" type="text" readonly>
          <button class="btn sm" id="copy-link" type="button">Copiar</button>
        </div>
      </section>

      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true" data-tab="bookings">Reservas</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="new">Nueva reserva</button>
        <button class="tab" role="tab" aria-selected="false" data-tab="settings">Configuración</button>
      </div>

      <section id="tab-bookings" class="card">
        <div class="toolbar" style="margin-bottom:0">
          <h2 style="margin:0">Próximas reservas</h2>
          <button class="btn ghost sm" id="refresh" type="button">Actualizar</button>
        </div>
        <div id="bookings"></div>
      </section>

      <form id="tab-new" class="card" hidden novalidate>
        <h2>Cargar reserva (teléfono o en persona)</h2>
        <div class="grid-2">
          <div class="field">
            <label for="n-day">Día</label>
            <input id="n-day" type="date" required>
          </div>
          <div class="field">
            <label for="n-court">Cancha</label>
            <select id="n-court"></select>
          </div>
          <div class="field">
            <label for="n-time">Horario libre</label>
            <select id="n-time"></select>
          </div>
          <div class="field">
            <label for="n-name">Nombre</label>
            <input id="n-name" type="text" maxlength="80" required>
          </div>
          <div class="field">
            <label for="n-phone">Teléfono</label>
            <input id="n-phone" type="tel" maxlength="30" required>
          </div>
        </div>
        <button class="btn block" type="submit">Guardar reserva</button>
        <p id="new-error" class="error" hidden></p>
      </form>

      <form id="tab-settings" hidden>
        <section class="card">
          <h2>Tu complejo</h2>
          <div class="grid-2">
            <div class="field">
              <label for="s-name">Nombre</label>
              <input id="s-name" type="text" maxlength="60" required>
            </div>
            <div class="field">
              <label for="s-address">Dirección (opcional)</label>
              <input id="s-address" type="text" maxlength="100">
            </div>
            <div class="field">
              <label for="s-wa">Tu WhatsApp</label>
              <input id="s-wa" type="tel" placeholder="Ej: 11 2233 4455" maxlength="20">
            </div>
            <div class="field">
              <label for="s-cc">Código de país para WhatsApp</label>
              <input id="s-cc" type="text" placeholder="549 = Argentina" maxlength="5">
            </div>
            <div class="field">
              <label for="s-days">Se puede reservar con hasta (días)</label>
              <input id="s-days" type="number" min="1" max="60">
            </div>
          </div>
        </section>

        <section class="card">
          <h2>Días y horarios</h2>
          <p class="muted small" style="margin-top:-6px">Si cerrás a medianoche, poné 00:00 como hora de cierre.</p>
          <div id="hours"></div>
        </section>

        <section class="card">
          <h2>Canchas</h2>
          <div class="court-row muted small" aria-hidden="true">
            <span>Nombre</span><span>Deporte</span><span>Minutos</span><span>Precio</span><span></span>
          </div>
          <div id="courts-edit"></div>
          <button class="btn ghost sm" type="button" id="add-court">+ Agregar cancha</button>
        </section>

        <button class="btn block" type="submit" id="save">Guardar cambios</button>
        <p id="save-error" class="error" hidden></p>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
